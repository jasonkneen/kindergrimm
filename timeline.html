<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawai — timeline</title>
<!--
  Six hundred years of painting, walked past. The axis is linear in
  years and nothing is compressed, so the empty road between the
  movements is as much of the picture as the movements are.

    python3 serve.py &
    chrome --headless=new --hide-scrollbars \
           --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
           --window-size=3200,900 --virtual-time-budget=240000 \
           --screenshot=/tmp/timeline.png \
           'http://localhost:8137/timeline?shot&fit&n=3'
-->
<style>
  :root { --ink: #1f1d1a; --paper: #f6f1e5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
         overscroll-behavior: none; }
  #stage { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; }

  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  /* a movement: its name on the shelf, its year under it */
  #labels b {
    position: absolute; top: 0; left: 0; white-space: nowrap;
    margin: 10px 0 0 0; transform-origin: 0 0;
    font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    opacity: .62; translate: -50% 0; text-align: center;
  }
  #labels b i { display: block; font-style: normal; font-size: 15px; letter-spacing: .12em;
                opacity: .45; margin-top: 2px; }
  #labels b.onDark { color: var(--paper); opacity: .85; }
  #labels b.onDark i { opacity: .6; }
  /* a century tick on the spine */
  #labels u {
    position: absolute; top: 0; left: 0; text-decoration: none;
    font-size: 10px; letter-spacing: .16em; opacity: .3; translate: -50% 0;
    padding-top: 14px;
  }
  #labels u::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 9px;
                      background: var(--ink); opacity: .35; }
  /* the empty road between two movements, named */
  #labels s {
    position: absolute; top: 0; left: 0; text-decoration: none; white-space: nowrap;
    font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
    opacity: .26; translate: -50% 0; margin-top: -26px;
  }

  #hud { position: absolute; top: 0; left: 0; right: 0; z-index: 3;
         display: flex; align-items: baseline; gap: 14px; padding: 12px 18px 10px;
         letter-spacing: .06em; background: linear-gradient(var(--paper) 62%, rgba(246,241,229,0)); }
  #hud h1 { font-size: 14px; letter-spacing: .14em; }
  #hud .hint { opacity: .45; }
  #hud a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(31,29,26,.35); }
  #hud a:hover { border-bottom-color: var(--ink); }
  #count { position: absolute; bottom: 16px; left: 18px; z-index: 3; opacity: .45; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="hud">
    <h1>timeline</h1>
    <span class="hint">drag or scroll to walk the centuries · 1-9 jumps · ?fit for the whole span</span>
    <a href="index.html">← menu</a>
  </div>
  <div id="count"></div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./src/timeline.js"></script>
</body>
</html>
