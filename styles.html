<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawai — styles</title>
<!--
  The contact sheet of STYLES: nine ways of painting the same five
  people, in era order. `?shot` draws the whole sheet synchronously
  before the first paint, which is what makes a headless still of it
  possible — a canvas rendered once and never again comes back blank,
  so shot mode still renders on the loop.

    python3 serve.py &
    chrome --headless=new --hide-scrollbars \
           --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
           --window-size=1400,420 --virtual-time-budget=180000 \
           --screenshot=/tmp/cubism.png \
           'http://localhost:8137/styles?style=cubism&shot&n=6&hand=brush'
-->
<style>
  :root { --ink: #1f1d1a; --paper: #f6f1e5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  #labels b { position: absolute; left: 14px; font-size: 11px; letter-spacing: .18em;
              text-transform: uppercase; opacity: .55; font-weight: 700; }
  #labels b i { font-style: normal; opacity: .5; margin-left: .6em; letter-spacing: .1em; }
  #labels b.onDark { color: var(--paper); opacity: .8; }
  #hud { position: absolute; top: 0; left: 0; right: 0; z-index: 3;
         display: flex; align-items: baseline; gap: 14px; padding: 12px 18px 10px;
         letter-spacing: .06em; background: linear-gradient(var(--paper) 62%, rgba(246,241,229,0)); }
  #hud h1 { font-size: 14px; letter-spacing: .14em; }
  #hud .hint { opacity: .45; }
  #hud a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(31,29,26,.35); }
  #hud a:hover { border-bottom-color: var(--ink); }
  #count { position: absolute; bottom: 16px; left: 18px; z-index: 3; opacity: .45; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="hud">
    <h1>styles</h1>
    <span class="hint">nine ways of painting the same five people · ?style= for one · ?hand=graphite</span>
    <a href="index.html">← menu</a>
  </div>
  <div id="count"></div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./src/stylesheet.js"></script>
</body>
</html>
