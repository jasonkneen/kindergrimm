<!DOCTYPE html>
<html lang="en">
<head>

<title>drawai — pipes</title>
<style>
  :root { --ink: #1f1d1a; --paper: #e9eef2; }
  * { box-sizing: border-box; margin: 0; }

  body { background: var(--paper); color: var(--ink); font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  #stage { position: absolute; inset: 0; touch-action: none; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px 10px; letter-spacing: .06em; color: #241f19;

  #hud h1 { font-size: 14px; letter-spacing: .14em; }
  #hud .hint { opacity: .5; }
  #hud a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(36,31,25,.4); }
  #count { position: absolute; bottom: 16px; left: 18px; z-index: 2; opacity: .5; color: #241f19; }
</style>
</head>

  <div id="stage"></div>
  <div id="hud">

    <a href="index.html">← menu</a>

  <div id="count"></div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
